name: Validate TDM mission

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate spawn architecture
        run: python tests/validate_spawn_system.py

      - name: Validate BO2 visual shell
        run: python tests/validate_ui_shell.py

      - name: Validate AI population
        run: python tests/validate_ai_population.py

      - name: Validate TDM match core
        run: python tests/validate_match_core.py

      - name: Validate arcade combat pace
        run: python tests/validate_combat_pace.py

      - name: Install SQF parser
        run: python -m pip install sqflint==0.3.2

      - name: Parse all SQF
        run: sqflint -d mission/SQC_TDM.Stratis -e e
