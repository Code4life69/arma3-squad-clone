name: Validate Arma mission
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SQF-VM
        run: python tools/fetch_sqfvm.py
      - name: Validate both mission structures and locality contracts
        run: python tests/validate_arena.py
      - name: Parse all SQF scripts
        run: python tests/lint_sqf.py
      - name: Execute pure SQF gameplay regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package mission
        run: python tools/package_mission.py
      - name: Verify packed mission and checksums
        run: python tests/verify_package.py
      - name: Check committed package matches source
        run: git diff --exit-code -- releases
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKLINE-Multiplayer
          path: releases/BLACKLINE-Multiplayer.zip
