name: Validate Arma mission

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate project structure and M001 invariants
        run: python tests/validate_structure.py

      - name: Install SQF linter
        run: python -m pip install sqflint==0.3.2

      - name: Parse SQF for syntax errors
        run: sqflint -d mission/SQC_SquadClone.VR -e e
